packages:
  - frontend
  - hono
  - media
  - remark

# Settings <https://pnpm.io/settings>

## Dependency Resolution

minimumReleaseAgeExclude:
  - '@types/*'
  - '@w0s/*'
  - oxlint-plugin-safely-storage
trustPolicy: no-downgrade
trustPolicyExclude:
  - cssnano-utils@9.0.0 # https://github.com/cssnano/cssnano/issues/2049
  - postcss-discard-comments@9.0.8 # https://github.com/cssnano/cssnano/issues/2049
  - postcss-discard-empty@9.0.8 # https://github.com/cssnano/cssnano/issues/2049
blockExoticSubdeps: true

## Dependency Hoisting Settings

publicHoistPattern:
  - 'markuplint'
  - 'stylelint'

## Peer Dependency Settings

strictPeerDependencies: true

## CLI Settings

engineStrict: true

## Build Settings

strictDepBuilds: true
allowBuilds:
  better-sqlite3: true
  esbuild: true

## Other Settings

savePrefix: '='
